<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bond Quest — Particle Herald Swords (Preview)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0d151c;font-family:system-ui,"Segoe UI",sans-serif;color:#eafaf4}
  #stage{position:absolute;inset:0}
  #top{position:absolute;top:0;left:0;right:0;padding:16px 20px;z-index:4;pointer-events:none}
  #top h1{font-size:15px;letter-spacing:.6px}
  #top .tag{font-size:11px;color:#ffd86a;border:1px solid rgba(255,216,106,.4);border-radius:99px;padding:3px 9px;margin-left:8px}
  #label{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
  #label b{font-size:22px;text-shadow:0 2px 12px #000}
  #label span{display:block;font-size:11px;letter-spacing:2px;color:#9fd8c4;text-transform:uppercase;margin-top:4px}
  #bar{position:absolute;bottom:0;left:0;right:0;padding:18px;display:flex;justify-content:center;gap:8px;z-index:4}
  #bar button{background:rgba(16,30,34,.88);color:#cfe9df;border:1px solid rgba(143,216,192,.35);border-radius:10px;padding:9px 15px;font-size:12px;font-weight:600;cursor:pointer}
  #bar button.on{background:#ffd86a;color:#0d1418;border-color:#ffd86a}
  #hint{position:absolute;right:18px;top:18px;z-index:4;font-size:11px;color:#7fa89a;text-align:right;line-height:1.7;pointer-events:none}
  #err{position:absolute;inset:0;display:none;place-items:center;background:#0d151c;color:#ff9a9a;z-index:9;padding:30px;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="top"><h1>PARTICLE HERALD · BLADES <span class="tag">PREVIEW ONLY · NOT IN GAME</span></h1></div>
<div id="hint">drag = orbit<br>wheel = zoom</div>
<div id="label"><b>—</b><span>—</span></div>
<div id="bar"></div>
<div id="err"></div>

<script src="_vendor/three.min.js"></script>
<script src="_src/swords-preview.js"></script>
<script>
(function(){
  var E=document.getElementById('err');
  function fail(m){E.style.display='grid';E.textContent='Preview error: '+m;}
  if(!window.THREE||!window.SwordModels){fail('THREE or SwordModels not loaded');return;}
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;
  document.getElementById('stage').appendChild(renderer.domElement);
  var scene=new THREE.Scene();scene.background=new THREE.Color(0x0d151c);
  var cam=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
  scene.add(new THREE.HemisphereLight(0xffffff,0x33404c,.8));
  var k=new THREE.DirectionalLight(0xfff2dc,1.0);k.position.set(4,7,6);k.castShadow=true;scene.add(k);
  var f=new THREE.DirectionalLight(0xbfe0ff,.45);f.position.set(-5,3,-4);scene.add(f);
  var floor=new THREE.Mesh(new THREE.CircleGeometry(2.0,48),new THREE.MeshStandardMaterial({color:0x18252d,roughness:.9}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-0.62;floor.receiveShadow=true;scene.add(floor);
  var pivot=new THREE.Group();scene.add(pivot);
  var yaw=0.5,pitch=0.1,dist=4.4,cur=0,model=null;

  function setSword(i){
    if(model){pivot.remove(model);model.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
    cur=i;model=window.SwordModels.build(i);pivot.add(model);
    document.querySelector('#label b').textContent=model.userData.label;
    document.querySelector('#label span').textContent='template '+(i+1)+' / '+window.SwordModels.count+' · not integrated';
    [].forEach.call(document.querySelectorAll('#bar button'),function(b,i2){b.classList.toggle('on',i2===i);});
  }
  var bar=document.getElementById('bar');
  window.SwordModels.names.forEach(function(n,i){
    var b=document.createElement('button');b.textContent=n.replace(/-/g,' ');
    b.addEventListener('click',function(){setSword(i);});bar.appendChild(b);
  });
  var drag=false,lx=0,ly=0,cv=renderer.domElement;
  cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',function(e){if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch+=(e.clientY-ly)*.006;pitch=Math.max(-.6,Math.min(1,pitch));lx=e.clientX;ly=e.clientY;});
  cv.addEventListener('pointerup',function(e){drag=false;try{cv.releasePointerCapture(e.pointerId);}catch(x){}});
  cv.addEventListener('wheel',function(e){dist*=e.deltaY>0?1.08:.92;dist=Math.max(2,Math.min(12,dist));e.preventDefault();},{passive:false});
  window.addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  window.__swords={setSword:setSword,setAngle:function(r){yaw=r;render();},getSword:function(){return cur;}};
  function render(){
    cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,.35+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);
    cam.lookAt(0,.35,0);renderer.render(scene,cam);
  }
  function loop(){render();requestAnimationFrame(loop);}
  setSword(0);render();loop();
})();
</script>
</body>
</html>
